# A customer router: MACsec over both circuits, keyed by MKA with a shared CAK.
devices:
  - {name: epl, port: eth1, mac: "02:00:00:0a:01:01", addresses: [10.0.1.1/24]}
  - {name: evpl, port: eth2, mac: "02:00:00:0a:02:01", vlans: [{vid: 100}], addresses: [10.0.2.1/24]}
protocols:
  # Port-level MACsec: the frame's VLAN tags (none here) are encrypted.
  - name: epl-macsec
    type: macsec
    device: epl
    config:
      mka:
        cak: "00112233445566778899aabbccddeeff"
        ckn: "6570"
        key_server_priority: 10
  # Under VLAN 100: the tag stays in front of the SecTAG for the SAP to match.
  - name: evpl-macsec
    type: macsec
    device: evpl
    config:
      mka:
        cak: "ffeeddccbbaa99887766554433221100"
        ckn: "657670"
        key_server_priority: 10
  # Full-size packets: 1500 bytes of IP, 1514 of Ethernet, 1546 with MACsec.
  - name: epl-ping
    type: icmp
    device: epl
    config: {destination: 10.0.1.2, rate: 20, payload_size: 1472, auto_start: true}
  - name: evpl-ping
    type: icmp
    device: evpl
    config: {destination: 10.0.2.2, rate: 20, payload_size: 1472, auto_start: true}
