# clabgen side of the SR-SIM interop lab (see sr1.partial.txt).
devices:
  - {name: v100, port: eth1, vlans: [{vid: 100}]}
  - {name: v200, port: eth1, vlans: [{vid: 200}]}
  - {name: t300a, port: eth1, vlans: [{vid: 300}], addresses: [10.0.30.1/24, 2001:db8:30::1/64]}
  - {name: t300b, port: eth2, vlans: [{vid: 300}], addresses: [10.0.30.2/24, 2001:db8:30::2/64]}
  # Host on SR IES 400 (interface 10.0.4.1/24, 2001:db8:4::1/64).
  - {name: v400, port: eth1, vlans: [{vid: 400}], addresses: [10.0.4.2/24, 2001:db8:4::2/64], gateway4: 10.0.4.1, gateway6: 2001:db8:4::1}
  # Second host behind another SR interface (eth2 VLAN 401): flows between
  # v400 and v401 are routed by the SR.
  # IS-IS peer of the SR (eth3 VLAN 500, point-to-point).
  - {name: i500, port: eth3, vlans: [{vid: 500}], addresses: [10.0.50.2/30, 2001:db8:50::2/64], gateway4: 10.0.50.1, gateway6: "2001:db8:50::1"}
  # Its second interface toward the SR (eth3 VLAN 502, point-to-point).
  - {name: i502, port: eth3, vlans: [{vid: 502}], addresses: [10.0.52.2/30, 2001:db8:52::2/64]}
  # Two IS-IS routers on the SR's broadcast interface (eth3 VLAN 501).
  - {name: l501a, port: eth3, vlans: [{vid: 501}], addresses: [10.0.60.2/24]}
  - {name: l501b, port: eth3, vlans: [{vid: 501}], addresses: [10.0.60.3/24]}
  - {name: v401, port: eth2, vlans: [{vid: 401}], addresses: [10.0.41.2/24, 2001:db8:41::2/64], gateway4: 10.0.41.1, gateway6: 2001:db8:41::1}
  # OSPF with the SR (eth3): VLAN 600 point-to-point (MD5), VLAN 601 broadcast.
  # OSPFv3 runs on the same links (IPv6 addresses).
  - {name: o600, port: eth3, vlans: [{vid: 600}], addresses: [10.0.70.2/30, "2001:db8:70::2/64"]}
  - {name: o601a, port: eth3, vlans: [{vid: 601}], addresses: [10.0.71.2/24, "2001:db8:71::2/64"]}
  - {name: o601b, port: eth3, vlans: [{vid: 601}], addresses: [10.0.71.3/24, "2001:db8:71::3/64"]}
  - {name: o602, port: eth3, vlans: [{vid: 602}], addresses: [10.0.72.2/24, "2001:db8:72::2/64"]}
  # Untagged devices for LLDP on the SR's ports 1/1/c1/1 and 1/1/c3/1.
  - {name: lldp1, port: eth1}
  - {name: lldp3, port: eth3}
protocols:
  # Peer: SR VPLS 100 SAP 1/1/c1/1:100 MEP 1, MD "lab" level 5, MA string "v100".
  - name: mep-v100
    type: cfm-mep
    device: v100
    config: {level: 5, mep_id: 101, remote_meps: [1], md_format: string, md_name: lab, ma_format: string, ma_name: v100, ccm_interval: 1s}
  # Peer: SR VPLS 200 SAP 1/1/c1/1:200 MEP 1, MD format none level 3, Y.1731 ICC MEG ID.
  - name: mep-icc
    type: cfm-mep
    device: v200
    config: {level: 3, mep_id: 2, remote_meps: [1], md_format: none, ma_format: icc, ma_name: CLABGEN00001, ccm_interval: 1s}
  # Two clabgen MEPs either side of SR VPLS 300, which has a level-6 MIP.
  - name: mep-t300a
    type: cfm-mep
    device: t300a
    config: {level: 6, mep_id: 301, remote_meps: [302], md_format: string, md_name: transit, ma_name: t300, ccm_interval: 1s}
  - name: mep-t300b
    type: cfm-mep
    device: t300b
    config: {level: 6, mep_id: 302, remote_meps: [301], md_format: string, md_name: transit, ma_name: t300, ccm_interval: 1s}
  # Traffic: continuous pings to the SR interface, and a TTL=1 flow through
  # the SR (expects ICMP time exceeded back).
  - name: ping-sr
    type: icmp
    device: v400
    config: {destination: 10.0.4.1, rate: 10, auto_start: true}
  - name: ping-sr-v6
    type: icmp
    device: v400
    config: {destination: "2001:db8:4::1", rate: 10, auto_start: true}
  - name: ttl1
    type: icmp
    device: v400
    config: {destination: 198.51.100.1, ttl: 1, rate: 1}
  # UDP routed through the SR: one way (v401 measures it) and echoed back.
  - name: echo-v401
    type: udp-echo
    device: v401
  - name: udp-routed
    type: udp
    device: v400
    config: {destination: 10.0.41.2, dst_port: 5001, rate: 100, auto_start: true}
  - name: udp-echo-routed
    type: udp
    device: v400
    config: {destination: "2001:db8:41::2", reply: echo, rate: 50, auto_start: true}
  # To a closed port on the SR: expect ICMP port unreachable.
  - name: udp-closed
    type: udp
    device: v400
    config: {destination: 10.0.4.1, dst_port: 9, rate: 1}
  # IS-IS with the SR on eth3 VLANs 500 and 502 (two parallel point-to-point
  # interfaces; level 2, area 49.0001). It advertises both interfaces'
  # addresses and its loopbacks (answered on either interface), injects 10
  # prefixes and emulates a 3×3 grid of routers behind it; ping-isis is
  # routed by the SR over the VLAN 500 adjacency (i502 costs more for SPF,
  # less for the delay flex-algo).
  - name: isis
    type: isis
    device: i500
    config: {system_id: 0000.0000.0050, hostname: clabgen, level: L2,
             # HMAC-SHA (RFC 5310) as on the SR: keychain isis-hello entry 2 for
             # hellos on isis-p2p, keychain isis-l2 entry 1 for level 2.
             hello_auth: {type: hmac-sha1, key: clabgen-sha1, key_id: 2},
             # The second interface, with the same hello key; a higher metric.
             interfaces: [{device: i502, metric: 50, delay_us: 300}],
             delay_us: 1000,
             loopbacks: [192.0.2.50/32, "2001:db8:ffff::50/128"],
             lsp_auth: {type: hmac-sha256, key: clabgen-sha256, key_id: 1},
             prefixes: [{prefix: 198.18.0.0/24, count: 10, metric: 20}],
             # Multi-topology: IPv6 unicast (MT 2) as on the SR.
             topologies: [ipv6-unicast],
             # Segment routing: our SRGB, a node SID on the 192.0.2.50 loopback,
             # adjacency labels from 24000; the grid gets node SIDs 100+ / 200+.
             segment_routing: {enabled: true, srgb_base: 16000, srgb_size: 8000, adj_sid_base: 24000,
                               srlb_base: 24000, srlb_size: 1000,
                               node_sids: [{prefix: 192.0.2.50/32, index: 50},
                                           {prefix: 192.0.2.50/32, index: 150, algorithm: 128},
                                           {prefix: 192.0.2.50/32, index: 151, algorithm: 129}],
                               # Mapping server: SIDs for the grid's (SID-less) prefixes.
                               mappings: [{prefix: 10.200.0.0/24, range: 4, index: 800}]},
             # Flex-algo 128 (defined here: delay) and 129 (defined by the SR).
             flex_algos: [{algorithm: 128, metric_type: delay, priority: 200}, {algorithm: 129, participate_only: true}],
             # SRv6 (uSID): locators for algorithms 0 and 128, End.X on adjacencies,
             # and a locator per simulated router.
             srv6: {enabled: true, behavior: un, end_x: true, topology_locator_base: "fc00:0:100::/48",
                    locators: [{prefix: "fc00:0:50::/48"}, {prefix: "fc00:80:50::/48", algorithm: 128}]},
             # A 3×3 grid of simulated routers behind us, attached at r1-1.
             topology: {kind: grid, rows: 3, cols: 3, loopback_base: 10.255.0.1/32,
                        loopback6_base: "2001:db8:ff::1/128",
                        prefix_base: 10.200.0.0/24, prefix6_base: "2001:db8:200::/64", prefixes_per_node: 2,
                        node_sid_base: 100, node_sid6_base: 200, link_delay_us: 1000,
                        flex_algo_sids: [{algorithm: 128, node_sid_base: 300}, {algorithm: 129, node_sid_base: 400}]}}
  - name: ping-isis
    type: icmp
    device: v400
    config: {destination: 192.0.2.50, rate: 100, timeout: 500ms, auto_start: true}
  # LAN: the SR and two clabgen routers; lan-b has the highest priority
  # and becomes DIS.
  - name: isis-lan-a
    type: isis
    device: l501a
    config: {system_id: 0000.0000.0061, hostname: lan-a, level: L2, circuit: broadcast,
             # SR OS also signs hellos with the level key where the interface has none.
             hello_auth: {type: hmac-sha256, key: clabgen-sha256, key_id: 1}, lsp_auth: {type: hmac-sha256, key: clabgen-sha256, key_id: 1}}
  - name: isis-lan-b
    type: isis
    device: l501b
    config: {system_id: 0000.0000.0062, hostname: lan-b, level: L2, circuit: broadcast, priority: 100,
             hello_auth: {type: hmac-sha256, key: clabgen-sha256, key_id: 1}, lsp_auth: {type: hmac-sha256, key: clabgen-sha256, key_id: 1},
             prefixes: [{prefix: 198.19.0.0/24, count: 5}]}
  # LLDP with the SR on two ports (SR: tx-interval 10, all basic TLVs).
  - name: lldp-eth1
    type: lldp
    device: lldp1
    config: {tx_interval: 10, system_name: gen1, chassis_id_subtype: local, chassis_id: gen1,
             capabilities: [bridge, router], management_addresses: [192.0.2.50],
             port_vlan_id: 1, vlan_names: [{vid: 100, name: v100}, {vid: 400, name: ies400}],
             max_frame_size: 9212, mac_phy: {autoneg_supported: false, autoneg_enabled: false, mau_type: 30}}
  - name: lldp-eth3
    type: lldp
    device: lldp3
    config: {tx_interval: 10, system_name: gen1, chassis_id_subtype: local, chassis_id: gen1,
             management_addresses: [192.0.2.50, "2001:db8:ffff::50"]}
  # BGP with the SR (AS 65100): eBGP over the VLAN 500 link and eBGP
  # multihop between the loopbacks (192.0.2.50, the IS-IS loopback, and the
  # SR's system address); IPv4 and IPv6 on both.
  - name: bgp
    type: bgp
    device: i500
    config: {local_as: 65050, router_id: 192.0.2.50, hold_time: 30,
             peers: [{address: 10.0.50.1, remote_as: 65100, families: [ipv4-unicast, ipv6-unicast], description: sr1 link},
                     {address: 192.0.2.100, remote_as: 65100, local_address: 192.0.2.50, ttl: 64,
                      families: [ipv4-unicast, ipv6-unicast], description: sr1 loopback}],
             routes: [{prefix: 100.64.0.0/24, count: 10000, communities: ["65050:1"], large_communities: ["65050:1:1"]},
                      {prefix: "2001:db8:abc::/48", count: 1000, med: 50},
                      {prefix: 203.0.113.0/24, as_path: [64512, 64513], communities: [no-export], peers: [10.0.50.1]}]}
  # OSPF area 0 with the SR: one router on the point-to-point link (MD5)
  # and the LAN (a keychain: HMAC-SHA-256 key 5, then key 6, rolled over
  # with the SR's keychain), where it is DR (priority 100); a second
  # router on the LAN at priority 0. The first injects 1000 externals and a
  # stub prefix, and emulates a 2×3 grid of routers behind it in area 2,
  # which makes it an area border router (the grid's prefixes summarised
  # as one range). Segment routing: node SIDs for it and the grid routers
  # (propagated into area 0), adjacency SIDs, flex-algo 128 (delay) with
  # link delays, TE LSAs; BFD on the point-to-point link.
  - name: ospf
    type: ospf
    device: o600
    config: {router_id: 192.0.2.60, network: point-to-point, auth: {type: md5, key: clabgen, key_id: 1},
             loopbacks: [192.0.2.60/32],
             interfaces: [{device: o601a, network: broadcast, priority: 100, auth: {type: keychain, keys: [{id: 5, type: hmac-sha256, key: clabgen-ospf, send_until: "2026-10-22T13:50:21Z"}, {id: 6, type: hmac-sha256, key: clabgen-ospf-2, send_from: "2026-10-22T13:50:21Z"}]}, delay_us: 300, bfd: false}],
             prefixes: [{prefix: 100.66.0.0/24, count: 1000, tag: 600}, {prefix: 100.65.60.0/24, type: internal, metric: 5}],
             delay_us: 2000, traffic_engineering: true, bfd: {enabled: true, min_tx_ms: 100, min_rx_ms: 100},
             segment_routing: {enabled: true, node_sids: [{prefix: 192.0.2.60/32, index: 60}, {prefix: 192.0.2.60/32, index: 560, algorithm: 128}]},
             flex_algos: [{algorithm: 128, metric_type: delay}],
             areas: [{id: 2, ranges: [{prefix: 100.72.0.0/20}]}],
             topology: {kind: grid, rows: 2, cols: 3, metric: 20, area: 2, router_id_base: 10.254.60.1,
                        loopback_base: 10.255.60.1/32, prefix_base: 100.72.0.0/24, prefixes_per_node: 2,
                        node_sid_base: 160, flex_algo_sids: [{algorithm: 128, node_sid_base: 660}], link_delay_us: 1000}}
  - name: ospf-lan-b
    type: ospf
    device: o601b
    config: {router_id: 192.0.2.62, priority: 0, auth: {type: keychain, keys: [{id: 5, type: hmac-sha256, key: clabgen-ospf, send_until: "2026-10-22T13:50:21Z"}, {id: 6, type: hmac-sha256, key: clabgen-ospf-2, send_from: "2026-10-22T13:50:21Z"}]}}
  # Area 1 on VLAN 602 is an NSSA with the SR as its border router: this
  # router's externals are type-7 LSAs the SR translates into area 0.
  - name: ospf-nssa
    type: ospf
    device: o602
    config: {router_id: 192.0.2.64, area: 1, areas: [{id: 1, type: nssa}], loopbacks: [192.0.2.64/32],
             prefixes: [{prefix: 100.73.0.0/24, count: 10, tag: 602}]}
  # OSPFv3 on the same two links, the same roles; segment routing in
  # extended LSAs (node SIDs for it and the ring routers in area 2).
  - name: ospf6
    type: ospfv3
    device: o600
    config: {router_id: 192.0.2.60, network: point-to-point, loopbacks: ["2001:db8:ffff::60/128"],
             interfaces: [{device: o601a, network: broadcast, priority: 100}],
             prefixes: [{prefix: "2001:db8:6600::/48", count: 500, tag: 600}, {prefix: "2001:db8:6500::/64", type: internal, metric: 5}],
             segment_routing: {enabled: true, node_sids: [{prefix: "2001:db8:ffff::60/128", index: 61}]},
             topology: {kind: ring, nodes: 4, area: 2, router_id_base: 10.254.66.1, loopback_base: "2001:db8:ff66::1/128", node_sid_base: 260,
                        prefix_base: "2001:db8:6900::/64", prefixes_per_node: 1}}
  - name: ospf6-lan-b
    type: ospfv3
    device: o601b
    config: {router_id: 192.0.2.62, priority: 0}
  - name: ospf6-nssa
    type: ospfv3
    device: o602
    config: {router_id: 192.0.2.64, area: 1, areas: [{id: 1, type: nssa}], loopbacks: ["2001:db8:ffff::64/128"],
             prefixes: [{prefix: "2001:db8:6800::/48", count: 10, tag: 602}]}
device_groups:
  # Eight CE routers on the SR's router interfaces ce1000-ce1007 (eth3
  # VLANs 1000-1007, 10.1.0.x/30), each in its own AS and advertising ten
  # /24s, peering with the SR's dynamic-neighbor group "ce".
  - name: ce
    count: 8
    device:
      port: eth3
      vlans: [{vid: {start: 1000}}]
      addresses: [{start: 10.1.0.2/30, step: 0.0.0.4}]
      gateway4: {start: 10.1.0.1, step: 0.0.0.4}
    protocols:
      - type: bgp
        config:
          local_as: {start: 65001}
          hold_time: 30
          peers: [{address: "{gateway4}", remote_as: 65100, description: sr1}]
          routes: [{prefix: {start: 172.16.0.0/24, step: 0.0.10.0}, count: 10, communities: ["65100:{i}"]}]
