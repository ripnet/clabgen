# Two clabgen agents back to back.
#   eth1: untagged MEPs, level 3, ICC MEG ID
#   eth2: dot1q VLAN 100 MEPs and QinQ 0x88a8:200/10 MEPs on the same port
name: b2b
topology:
  defaults:
    kind: linux
    image: ${CLABGEN_IMAGE:=ghcr.io/ripnet/clabgen:latest}
  nodes:
    gen1:
      binds: [gen1.yml:/etc/clabgen/scenario.yml:ro, .:/clab]   # .:/clab keeps the config in clab-<lab>/gen1/
      env: {CLABGEN_SCENARIO: /etc/clabgen/scenario.yml}
    gen2:
      binds: [gen2.yml:/etc/clabgen/scenario.yml:ro, .:/clab]   # .:/clab keeps the config in clab-<lab>/gen2/
      env: {CLABGEN_SCENARIO: /etc/clabgen/scenario.yml}
  links:
    - endpoints: [gen1:eth1, gen2:eth1]
    - endpoints: [gen1:eth2, gen2:eth2]
