devices:
  - {name: untagged, port: eth1, addresses: [192.0.2.2/24, 2001:db8::2/64]}
  - {name: v100, port: eth2, vlans: [{vid: 100}], addresses: [10.0.100.2/24]}
  - {name: qinq, port: eth2, vlans: [{tpid: 0x88a8, vid: 200}, {vid: 10}]}
protocols:
  - name: mep-untagged
    type: cfm-mep
    device: untagged
    config: {level: 3, mep_id: 2, remote_meps: [1], ma_format: icc, ma_name: CLABGEN00001, ccm_interval: 100ms}
  - name: mep-v100
    type: cfm-mep
    device: v100
    config: {level: 5, mep_id: 102, remote_meps: [101], md_format: string, md_name: lab, ma_name: v100, ccm_interval: 1s,
             port_status_tlv: true, interface_status_tlv: true}
  - name: mep-qinq
    type: cfm-mep
    device: qinq
    config: {level: 2, mep_id: 202, ma_format: integer, ma_name: "200", ccm_interval: 10ms}
  - name: echo
    type: udp-echo
    device: untagged
    config: {ports: [7]}
