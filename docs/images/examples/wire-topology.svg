<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 560" width="1460" height="560" role="img" aria-label="ce-a agent, SR-SIM sr1, SR-SIM sr2, ce-b agent with three Epipes; sr1 mirrors the core link to the tap agent">
