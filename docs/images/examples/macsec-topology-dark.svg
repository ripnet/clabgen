<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" role="img" aria-label="ce-a agent, SR-SIM sr1, SR-SIM sr2, ce-b agent, with two Epipes carrying MACsec">
<style>
  .box { fill: #22272e; stroke-width: 2.5; }
  .agent { stroke: #4c8dff; }
  .router { stroke: #2dd4bf; }
  .title { font: 600 26px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #e6edf3; }
  .kind { font: 17px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #9198a1; }
  .line { font: 19px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #e6edf3; }
  .port { font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9198a1; }
  .note { font: 18px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #9198a1; }
  .flowlbl { font: 18px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #f59e0b; }
  .wire { stroke: #768390; stroke-width: 3; }
  .flow { stroke: #f59e0b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<line x1="220" y1="190" x2="330" y2="190" class="wire"/>
<text x="226" y="180" class="port" text-anchor="start">eth1</text>
<text x="324" y="180" class="port" text-anchor="end">c1/1</text>
<line x1="910" y1="190" x2="1020" y2="190" class="wire"/>
<text x="916" y="180" class="port" text-anchor="start">c1/1</text>
<text x="1014" y="180" class="port" text-anchor="end">eth1</text>
<line x1="220" y1="290" x2="330" y2="290" class="wire"/>
<text x="226" y="280" class="port" text-anchor="start">eth2</text>
<text x="324" y="280" class="port" text-anchor="end">c3/1</text>
<line x1="910" y1="290" x2="1020" y2="290" class="wire"/>
<text x="916" y="280" class="port" text-anchor="start">c3/1</text>
<text x="1014" y="280" class="port" text-anchor="end">eth2</text>
<text x="275.0" y="218" class="note" text-anchor="middle">untagged</text>
<text x="275.0" y="318" class="note" text-anchor="middle">VLAN 100</text>
<line x1="530" y1="235.0" x2="710" y2="235.0" class="wire"/>
<text x="536" y="225.0" class="port" text-anchor="start">c2/1</text>
<text x="704" y="225.0" class="port" text-anchor="end">c2/1</text>
<text x="620.0" y="263.0" class="note" text-anchor="middle">IS-IS, LDP</text>
<rect x="20" y="120" width="200" height="230" rx="10" class="box agent"/>
<text x="120.0" y="160" class="title" text-anchor="middle">ce-a</text>
<text x="120.0" y="184" class="kind" text-anchor="middle">clabgen agent</text>
<text x="120.0" y="220" class="line" text-anchor="middle">customer router</text>
<text x="120.0" y="246" class="line" text-anchor="middle">MKA key server</text>
<text x="120.0" y="272" class="line" text-anchor="middle">pings both circuits</text>
<rect x="330" y="120" width="200" height="230" rx="10" class="box router"/>
<text x="430.0" y="160" class="title" text-anchor="middle">sr1</text>
<text x="430.0" y="184" class="kind" text-anchor="middle">Nokia SR-SIM</text>
<text x="430.0" y="220" class="line" text-anchor="middle">Epipes:</text>
<text x="430.0" y="246" class="line" text-anchor="middle">epl, null SAP</text>
<text x="430.0" y="272" class="line" text-anchor="middle">evpl, SAP :100</text>
<rect x="710" y="120" width="200" height="230" rx="10" class="box router"/>
<text x="810.0" y="160" class="title" text-anchor="middle">sr2</text>
<text x="810.0" y="184" class="kind" text-anchor="middle">Nokia SR-SIM</text>
<text x="810.0" y="220" class="line" text-anchor="middle">Epipes:</text>
<text x="810.0" y="246" class="line" text-anchor="middle">epl, null SAP</text>
<text x="810.0" y="272" class="line" text-anchor="middle">evpl, SAP :100</text>
<rect x="1020" y="120" width="200" height="230" rx="10" class="box agent"/>
<text x="1120.0" y="160" class="title" text-anchor="middle">ce-b</text>
<text x="1120.0" y="184" class="kind" text-anchor="middle">clabgen agent</text>
<text x="1120.0" y="220" class="line" text-anchor="middle">customer router</text>
<text x="1120.0" y="246" class="line" text-anchor="middle">answers</text>
<path d="M120.0,112 V84 H1120.0 V110" class="flow" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="620.0" y="72" class="flowlbl" text-anchor="middle">epl: MACsec at port level, MKA with CAK 1 · service-mtu 1546</text>
<path d="M120.0,358 V386 H1120.0 V360" class="flow" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="620.0" y="412" class="flowlbl" text-anchor="middle">evpl: MACsec under VLAN 100 (in clear), MKA with CAK 2 · service-mtu 1546</text>
</svg>
