# Tests: Go (vet, gofmt, unit tests and the UI schema fixture under -race;
# the internal/core engine tests, which mostly wait on protocol timers, in
# parallel shards), the Python package (unit tests, and live tests against
# the agent in a container), the web UI (typecheck, build, Playwright
# against a mocked agent) and the documentation site (a strict build).
# Runs on pull requests; images.yml runs it before publishing from dev or
# a release tag. Pushes to main aren't tested again: main only moves to a
# dev commit that passed.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04 # Playwright 1.57 has no Chromium for newer Ubuntu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: go test (all but internal/core)
        run: go test -race -count=1 $(go list ./... | grep -v '/internal/core$')

  core:
    name: core (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3] # the 4 in the name and the script call must match
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: .github/scripts/test-shard.sh ${{ matrix.shard }} 4 -race

  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: agent binary for the live tests
        run: CGO_ENABLED=0 go build -o bin/ ./cmd/clabgen-agent
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "./python[test]"
      - name: pytest (the live tests run the agent in a container)
        run: pytest python -ra
      - name: package builds
        if: matrix.python == '3.13'
        run: pip install build && python -m build python

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r .github/docs/requirements.txt
      - name: mkdocs build (strict, so broken links fail)
        run: mkdocs build --strict -d site

  web:
    runs-on: ubuntu-24.04 # Playwright 1.57 has no Chromium for newer Ubuntu
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build # includes the typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7
