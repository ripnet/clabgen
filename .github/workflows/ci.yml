# Tests: Go (vet, gofmt, unit and engine tests under -race, the UI schema
# fixture) and the web UI (typecheck, build, Playwright against a mocked
# agent). Runs on pull requests and pushes to main; images.yml runs it
# before publishing from dev or a release tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04 # Playwright 1.57 has no Chromium for newer Ubuntu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-24.04 # Playwright 1.57 has no Chromium for newer Ubuntu
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build # includes the typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7
